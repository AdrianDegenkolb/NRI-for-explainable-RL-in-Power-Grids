# Optuna search for the Fraunhofer-style Junior (experiments/pretrain_hpo.py --config-name pretrain_hpo_mlp):
# one MLP of fixed size [400, 773, 1044, 344] (Lehna et al. 2023) on the flat obs.to_vect() observation,
# hard labels only. Objective, epochs and pruner as in pretrain_hpo.yaml (Junior Continued), so the study is
# comparable to junior2_hard; only model, input and the (architecture-free) search space differ.
# Study name: junior2_mlp_hard. Trials are written to imitation.out_dir (results/junior/<study>/trial_<n>/).
defaults:
  - config
  - override env: case36
  - override model: flat_mlp
  - override obs_space: flat_vect
  - override relation_awareness: disabled
  - override imitation: default
  - _self_

imitation:
  dataset: data/imitation/case36_k208_greedy_hard.npz
  epochs: 150           # cap; early stopping (patience) usually ends a trial before
  monitor: regret_top20 # mean regret of top-20 simulation on the val split

hpo:
  n_trials: 40          # trials per study (complete + pruned + failed), shared by all workers
  worker_id: 0          # distinct per parallel worker (SLURM array task id)
  sampler_seed: 0       # hashed with the study name and worker id (imitation.hpo.study_sampler_seed)
  monitor: val_${imitation.monitor}  # history column to minimise: Optuna objective and pruning
  convert_only: false   # only convert (and cache) the observations, then exit; run once before the workers
  pruner:               # PercentilePruner
    percentile: 75      # prune a trial only if it is worse than 75 % of the completed trials (the worst quarter)
    n_startup_trials: 10 # no pruning before this many trials have completed (pruned ones do not count)
    n_warmup_steps: 20  # no pruning before epoch 20
  # Keys are dotted paths into this config. Types: float (low, high, log), int (low, high), categorical (choices).
  # The architecture is fixed; the paper's Junior used lr 1.3e-4, batch size 768 and dropouts 0.16 / 0.41.
  search_space:
    imitation.lr: {type: float, low: 1.0e-5, high: 1.0e-2, log: true}
    imitation.batch_size: {type: categorical, choices: [128, 256, 512, 768]}
    imitation.weight_decay: {type: float, low: 1.0e-5, high: 1.0e-2, log: true}
    imitation.patience: {type: categorical, choices: [3, 5, 10]}
    model.mlp.dropout_prob: {type: float, low: 0.0, high: 0.5}

hydra:
  run:
    dir: ${imitation.out_dir}/hydra/worker_${hpo.worker_id}
