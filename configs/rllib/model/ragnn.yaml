# Model registered as "ragnn_model" in ModelCatalog (RARLModel).
# encoder + gnn are placed into custom_model_config by the training script.
custom_model: ragnn_model
fcnet_hiddens: [256, 256, 256]
fcnet_activation: relu
post_fcnet_hiddens: [256, 128]
_enable_learner_api: false

encoder:
  max_degree: 8
  max_path_distance: 55
  use_graphormer: true
  hidden_dim: 256
  num_layers: 2

gnn:
  hidden_dim: 256
  out_dim: 64
  num_layers: 3
  residual: true
  edge_probs_path: ${hydra:runtime.cwd}/results/edge_probabilities/rappo_essence_graph.npy
