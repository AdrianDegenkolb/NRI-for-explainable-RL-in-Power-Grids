# Model registered as "ragnn_model" in ModelCatalog (RARLModel).
# encoder + gnn are placed into custom_model_config by the training script.
custom_model: ragnn_model
fcnet_hiddens: [64, 64]
fcnet_activation: relu
post_fcnet_hiddens: []
_enable_learner_api: false

encoder:
  max_degree: 20
  max_path_distance: 50
  use_graphormer: true
  hidden_dim: 32
  num_layers: 2
  num_attention_heads: 2
  dropout_prob: 0.0

gnn:
  hidden_dim: 64
  out_dim: 64
  num_layers: 1
  residual: true
  conv_type: gcn
  edge_probs_path: ${hydra:runtime.cwd}/results/edge_probabilities/rappo_essence_graph.npy # only used for dummy edge dists
  sparsify_threshold: 0.0  # sum of interaction-type probs below this → edge dropped. 0.0 = disabled
  diagnose_every: 0        # run self-loop diagnostic every N eval calls. 0 = disabled
