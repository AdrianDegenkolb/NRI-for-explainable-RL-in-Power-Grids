sampling:
  tau_start: 1.5   # initial Gumbel-Softmax temperature
  tau_end: 0.5     # temperature to anneal towards
  tau: 0.5         # fixed value used when annealing is disabled

prior:
  prior_prob_for_graph_edge: 0.9   # prior probability that a powerline edge exists
  temperature: 0.5                 # controls how many non-powerline edges the encoder adds

loss:
  beta_graph_edges_start: 0.1
  beta_graph_edges_end: 0.4
  beta_graph_edges: 0.4            # KL weight for graph (powerline) edges
  beta_non_graph_edges_start: 0.1
  beta_non_graph_edges_end: 0.4
  beta_non_graph_edges: 0.4        # KL weight for non-graph edges

latent_space:
  num_edge_types: 2

sparsification:
  top_k_multiplier: 0    # 0 = disabled (full FC graph). Set to 5-10 to enable top-K filtering.
  log_every_n_steps: 50  # how often to emit sparsification diagnostics to TensorBoard

pretraining:
  num_epochs: 1          # set to 0 to disable pretraining
  num_observations: 10   # environment steps sampled to build the pretraining dataset
  lr: 1.0e-3             # Adam learning rate for the encoder during pretraining
